<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightwatch — Prototyp Dashboard & Regel-Anlage (#8)</title>
</head>
<body>
<!--
  WEGWERF-PROTOTYP — Wayfinder-Ticket #8 (Nightwatch).
  Drei radikal verschiedene Varianten von Dashboard + Regel-Anlage,
  umschaltbar via ?variant=A|B|C und schwebender Leiste unten (auch ←/→-Tasten).
  Alles Fake-Daten, nichts wird gespeichert.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }

  /* ---------- Prototyp-Chrome (nicht Teil des Designs) ---------- */
  .proto-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 900;
    background: repeating-linear-gradient(45deg, #1c1c1c, #1c1c1c 12px, #2b2b2b 12px, #2b2b2b 24px);
    color: #f5d90a; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 12px; text-align: center;
  }
  .proto-banner a { color: #f5d90a; }
  .proto-bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 900;
    display: flex; align-items: center; gap: 4px;
    background: #111; color: #fff; border-radius: 999px; padding: 6px 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); border: 1px solid #444;
  }
  .proto-bar button {
    background: none; border: none; color: #fff; font-size: 16px; line-height: 1;
    padding: 4px 8px; border-radius: 999px;
  }
  .proto-bar button:hover { background: #333; }
  .proto-bar .lbl { font-size: 12.5px; padding: 0 8px; min-width: 210px; text-align: center; }
  .proto-bar .lbl b { letter-spacing: .05em; }
  #app { padding-top: 24px; min-height: 100vh; }

  /* ---------- Status (Ampel) — Farbe nie allein: immer Form + Text ---------- */
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .st .dot { width: 10px; height: 10px; display: inline-block; flex: none; }
  .st-gesund .dot   { background: #0ca30c; border-radius: 50%; }
  .st-gestoert .dot { background: #d03b3b; border-radius: 2px; transform: rotate(45deg); }
  .st-pausiert .dot { background: #8a8f98; border-radius: 2px; }
  .st-gesund   { color: #0a7d0a; }
  .st-gestoert { color: #b32e2e; }
  .st-pausiert { color: #6b7079; }
  .dark .st-gesund   { color: #4fd44f; }
  .dark .st-gestoert { color: #ff7a70; }
  .dark .st-pausiert { color: #9aa2af; }

  .tip { position: relative; }
  .tip:hover::after {
    content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); background: #16181c; color: #f2f4f8; font-size: 11.5px;
    padding: 5px 8px; border-radius: 6px; white-space: pre; z-index: 500;
    box-shadow: 0 4px 14px rgba(0,0,0,.3); pointer-events: none; font-weight: 400;
  }

  .badge-frage {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    background: #fab219; color: #4a3402; border-radius: 4px; padding: 2px 6px; vertical-align: middle;
  }

  /* ================= VARIANTE A — Kundenboard ================= */
  .vA { background: #f2f4f6; color: #1b2430; min-height: 100vh; padding-bottom: 90px; }
  .vA header { background: #fff; border-bottom: 1px solid #dde2e8; padding: 14px 28px; display: flex; align-items: baseline; gap: 18px; }
  .vA header h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
  .vA header h1 span { color: #0e6e6e; }
  .vA header .sub { color: #66707c; font-size: 12.5px; }
  .vA header .spacer { flex: 1; }
  .vA .btn-primary { background: #0e6e6e; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; }
  .vA .btn-primary:hover { background: #0a5757; }
  .vA main { max-width: 1180px; margin: 0 auto; padding: 20px 28px; }
  .vA h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: #66707c; margin: 22px 0 10px; }
  .vA .alarmstrip { display: flex; flex-direction: column; gap: 8px; }
  .vA .alarmchip {
    display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e5b3b0;
    border-left: 4px solid #d03b3b; border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  .vA .alarmchip:hover { background: #fdf7f6; }
  .vA .alarmchip .grund { font-weight: 700; font-size: 13px; color: #b32e2e; min-width: 150px; }
  .vA .alarmchip .was { font-size: 13.5px; }
  .vA .alarmchip .was b { font-weight: 600; }
  .vA .alarmchip .seit { margin-left: auto; color: #66707c; font-size: 12px; }
  .vA .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
  .vA .card {
    background: #fff; border: 1px solid #dde2e8; border-radius: 10px; padding: 14px 16px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
  }
  .vA .card:hover { border-color: #0e6e6e; box-shadow: 0 2px 10px rgba(14,110,110,.08); }
  .vA .card .kname { font-weight: 650; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .vA .card .counts { display: flex; gap: 12px; flex-wrap: wrap; }
  .vA .card .meta { color: #66707c; font-size: 11.5px; border-top: 1px dashed #e3e7ec; padding-top: 8px; display: flex; gap: 10px; }
  .vA .triage-list { display: flex; flex-direction: column; gap: 8px; }
  .vA .triage-item { background: #fff; border: 1px solid #ecd9a8; border-left: 4px solid #fab219; border-radius: 8px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 13px; }
  .vA .triage-item .grund { font-weight: 700; color: #8a6408; min-width: 205px; font-size: 12.5px; }
  .vA .triage-item .mail { color: #333c48; }
  .vA .triage-item .mail .mono { font-size: 12px; color: #66707c; }
  .vA .triage-item .act { margin-left: auto; }
  .vA .triage-item .act button { background: none; border: 1px solid #c5ccd4; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; }
  .vA .triage-item .act button:hover { border-color: #0e6e6e; color: #0e6e6e; }

  .vA .drawer-scrim { position: fixed; inset: 0; background: rgba(20,28,38,.45); z-index: 800; }
  .vA .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 94vw); background: #fff; z-index: 810;
    box-shadow: -8px 0 30px rgba(0,0,0,.2); padding: 20px 24px 90px; overflow-y: auto;
  }
  .vA .drawer .close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 20px; color: #66707c; }
  .vA .drawer .back { background: none; border: none; color: #0e6e6e; font-size: 12.5px; padding: 0; margin-bottom: 10px; font-weight: 600; }
  .vA .drawer h3 { margin: 4px 0 2px; font-size: 17px; }
  .vA .drawer .sub { color: #66707c; font-size: 12.5px; margin-bottom: 14px; }
  .vA .mlist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .vA .mrow { border: 1px solid #dde2e8; border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .vA .mrow:hover { border-color: #0e6e6e; }
  .vA .mrow .mname { font-weight: 600; font-size: 13.5px; }
  .vA .mrow .mart { font-size: 11px; color: #66707c; border: 1px solid #dde2e8; border-radius: 4px; padding: 1px 6px; }
  .vA .mrow .st { margin-left: auto; }
  .vA .detail dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; margin: 14px 0; }
  .vA .detail dt { color: #66707c; }
  .vA .detail dd { margin: 0; }
  .vA .aktionen { border: 1px solid #dde2e8; border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .vA .aktionen .ok { color: #0a7d0a; }
  .vA .mailbox { background: #f6f8fa; border: 1px solid #dde2e8; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-top: 12px; }
  .vA .mailbox .betreff { font-weight: 600; }
  .vA .rueckverweis { display: inline-block; margin-top: 12px; background: #eef6f6; border: 1px solid #bcd8d8; color: #0a5757; border-radius: 6px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; text-decoration: none; }

  /* Wizard-Modal A */
  .vA .modal-scrim { position: fixed; inset: 0; background: rgba(20,28,38,.5); z-index: 850; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .vA .modal { background: #fff; border-radius: 12px; width: min(560px, 96vw); max-height: 88vh; overflow-y: auto; padding: 22px 26px; position: relative; }
  .vA .modal .close { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 20px; color: #66707c; }
  .vA .steps { display: flex; gap: 6px; margin: 10px 0 18px; }
  .vA .steps .s { flex: 1; height: 4px; border-radius: 2px; background: #e3e7ec; }
  .vA .steps .s.on { background: #0e6e6e; }
  .vA .modal h3 { margin: 0; font-size: 16px; }
  .vA .modal .stepname { color: #66707c; font-size: 12.5px; margin-top: 2px; }
  .vA .field { margin-bottom: 13px; }
  .vA .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .vA .field .hint { font-size: 11.5px; color: #66707c; font-weight: 400; margin-top: 3px; }
  .vA .field input[type=text], .vA .field select, .vA .field textarea {
    width: 100%; border: 1px solid #c5ccd4; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; background: #fff;
  }
  .vA .artgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vA .artopt { border: 1px solid #c5ccd4; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .vA .artopt:hover { border-color: #0e6e6e; }
  .vA .artopt.sel { border-color: #0e6e6e; background: #eef6f6; }
  .vA .artopt .an { font-weight: 650; font-size: 13.5px; }
  .vA .artopt .ad { font-size: 11.5px; color: #66707c; margin-top: 2px; }
  .vA .modal footer { display: flex; justify-content: space-between; margin-top: 18px; }
  .vA .btn-ghost { background: none; border: 1px solid #c5ccd4; border-radius: 8px; padding: 8px 14px; font-size: 13.5px; }
  .vA .radio-row { display: flex; gap: 14px; font-size: 13px; align-items: center; flex-wrap: wrap; }
  .vA .toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); background: #0e6e6e; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 950; font-size: 13.5px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }

  /* ================= VARIANTE B — Leitstand (dunkel) ================= */
  .vB { background: #0d1420; color: #e6edf6; min-height: 100vh; padding-bottom: 90px; }
  .vB header { display: flex; align-items: center; gap: 26px; padding: 14px 26px; border-bottom: 1px solid #223048; }
  .vB header h1 { font-size: 15px; margin: 0; letter-spacing: .14em; text-transform: uppercase; color: #4cc3e8; }
  .vB .counters { display: flex; gap: 22px; margin-left: auto; }
  .vB .counter { text-align: right; }
  .vB .counter .n { font-size: 22px; font-weight: 700; line-height: 1; }
  .vB .counter .t { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: #8fa0b8; }
  .vB .counter.crit .n { color: #ff7a70; }
  .vB .counter.warn .n { color: #fab219; }
  .vB .counter.ok .n { color: #4fd44f; }
  .vB .counter.pause .n { color: #9aa2af; }
  .vB .btn-primary { background: #4cc3e8; color: #06222e; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 700; font-size: 13px; }
  .vB .btn-primary:hover { background: #7ad3ef; }
  .vB .split { display: grid; grid-template-columns: 360px 1fr; gap: 0; border-bottom: 1px solid #223048; min-height: 300px; }
  .vB .alarmcol { border-right: 1px solid #223048; }
  .vB .colhead { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: #8fa0b8; padding: 12px 18px 8px; }
  .vB .alarmrow { padding: 10px 18px; cursor: pointer; border-left: 3px solid transparent; }
  .vB .alarmrow:hover { background: #121c2c; }
  .vB .alarmrow.sel { background: #16233a; border-left-color: #ff7a70; }
  .vB .alarmrow .l1 { display: flex; gap: 8px; align-items: baseline; }
  .vB .alarmrow .grund { color: #ff7a70; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .vB .alarmrow .dauer { margin-left: auto; color: #8fa0b8; font-size: 11.5px; }
  .vB .alarmrow .l2 { font-size: 13px; margin-top: 3px; }
  .vB .alarmrow .l2 b { color: #fff; }
  .vB .alarmrow .l2 span { color: #8fa0b8; }
  .vB .detailpane { padding: 14px 22px; }
  .vB .detailpane h3 { margin: 0 0 2px; font-size: 16px; }
  .vB .detailpane .sub { color: #8fa0b8; font-size: 12.5px; }
  .vB .kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 14px; font-size: 13px; margin: 14px 0; }
  .vB .kv dt { color: #8fa0b8; }
  .vB .kv dd { margin: 0; }
  .vB .panelbox { background: #121c2c; border: 1px solid #223048; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-top: 10px; }
  .vB .panelbox .h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: #8fa0b8; margin-bottom: 6px; }
  .vB .panelbox .ok { color: #4fd44f; }
  .vB .actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .vB .btn-ghost { background: none; border: 1px solid #2e415f; color: #cdd9e8; border-radius: 6px; padding: 7px 12px; font-size: 12.5px; }
  .vB .btn-ghost:hover { border-color: #4cc3e8; color: #4cc3e8; }
  .vB table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .vB th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: #8fa0b8; padding: 10px 12px; border-bottom: 1px solid #223048; font-weight: 600; }
  .vB td { padding: 9px 12px; border-bottom: 1px solid #18243a; }
  .vB tr.mtr:hover td { background: #121c2c; }
  .vB td .artchip { font-size: 10.5px; border: 1px solid #2e415f; color: #8fa0b8; border-radius: 4px; padding: 1px 6px; }
  .vB .tablewrap { overflow-x: auto; padding: 0 14px 20px; }
  .vB .triagechip { color: #fab219; font-weight: 700; }
  .vB .uhr { margin-left: 20px; color: #8fa0b8; font-size: 12.5px; }

  /* Inline-Formular B */
  .vB .formpanel { border-bottom: 1px solid #223048; background: #101a2a; padding: 16px 26px 20px; }
  .vB .formpanel h3 { margin: 0 0 12px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #4cc3e8; }
  .vB .fgrid { display: grid; grid-template-columns: repeat(3, minmax(210px, 1fr)); gap: 14px 18px; }
  .vB .fld label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8fa0b8; margin-bottom: 4px; }
  .vB .fld input, .vB .fld select, .vB .fld textarea {
    width: 100%; background: #0d1420; border: 1px solid #2e415f; color: #e6edf6; border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  .vB .fld .hint { font-size: 11px; color: #667891; margin-top: 3px; }
  .vB .fsection { grid-column: 1 / -1; border-top: 1px dashed #223048; padding-top: 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #8fa0b8; }
  .vB .formfoot { display: flex; gap: 10px; margin-top: 16px; align-items: center; }

  /* ================= VARIANTE C — Zeitachse ================= */
  .vC { background: #ffffff; color: #14161a; min-height: 100vh; padding-bottom: 90px; }
  .vC header { padding: 18px 32px 10px; display: flex; align-items: baseline; gap: 16px; border-bottom: 2px solid #14161a; }
  .vC header h1 { font-size: 19px; margin: 0; }
  .vC header h1 em { font-style: normal; color: #4a4fbf; }
  .vC header .sub { color: #5c6270; font-size: 12.5px; }
  .vC header .spacer { flex: 1; }
  .vC .legende { display: flex; gap: 16px; font-size: 11.5px; color: #5c6270; align-items: center; }
  .vC main { max-width: 1240px; margin: 0 auto; padding: 8px 32px; }
  .vC .layout { display: grid; grid-template-columns: 1fr 330px; gap: 28px; align-items: start; }
  .vC .kgroup { margin-top: 18px; }
  .vC .kgroup .khead {
    display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0;
    border-bottom: 1px solid #d9dce3; user-select: none;
  }
  .vC .kgroup .khead .caret { font-size: 11px; color: #5c6270; width: 12px; }
  .vC .kgroup .khead .kname { font-weight: 700; font-size: 14px; }
  .vC .kgroup .khead .ksum { margin-left: auto; }
  .vC .mline { display: grid; grid-template-columns: 250px 1fr 120px 110px; gap: 14px; align-items: center; padding: 8px 0 8px 22px; border-bottom: 1px solid #eceef2; }
  .vC .mline:hover { background: #f7f8fb; }
  .vC .mline.gestoert { background: #fdf6f5; }
  .vC .mline.gestoert:hover { background: #fbefed; }
  .vC .mline .mname { font-size: 13px; font-weight: 600; cursor: pointer; }
  .vC .mline .mname:hover { color: #4a4fbf; }
  .vC .mline .mart { font-size: 10.5px; color: #5c6270; }
  .vC .dots { display: flex; gap: 0; align-items: center; height: 26px; }
  .vC .day { flex: 1; display: flex; gap: 3px; align-items: center; justify-content: center; border-left: 1px solid #eceef2; height: 100%; }
  .vC .day:first-child { border-left: none; }
  .vC .d { width: 9px; height: 9px; border-radius: 50%; display: inline-block; cursor: default; }
  .vC .d-ok { background: #0ca30c; }
  .vC .d-fehler { background: #d03b3b; border-radius: 2px; transform: rotate(45deg); }
  .vC .d-unklar { background: #fff; border: 2px solid #d03b3b; width: 8px; height: 8px; }
  .vC .d-erwartet { background: #fff; border: 1.5px dashed #a0a6b1; }
  .vC .d-fehlt { background: #fff; border: 2px solid #d03b3b; border-radius: 0; transform: rotate(45deg); width: 8px; height: 8px; }
  .vC .d-pause { background: #d3d6dc; }
  .vC .next { font-size: 11.5px; color: #5c6270; text-align: right; }
  .vC .next.due { color: #b32e2e; font-weight: 700; }
  .vC .mline .st { justify-self: end; }
  .vC .expand { grid-column: 1 / -1; background: #fbfbfd; border: 1px solid #d9dce3; border-radius: 8px; padding: 14px 18px; margin: 4px 0 10px; }
  .vC .expand h4 { margin: 0 0 8px; font-size: 13.5px; }
  .vC .expand .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .vC .expand .kv dt { color: #5c6270; }
  .vC .expand .kv dd { margin: 0; }
  .vC .expand .rueck { display: inline-block; margin-top: 10px; color: #4a4fbf; font-weight: 600; font-size: 12.5px; text-decoration: none; border-bottom: 1px dashed #4a4fbf; }
  .vC .daylabels { display: grid; grid-template-columns: 250px 1fr 120px 110px; gap: 14px; padding-left: 22px; margin-top: 14px; }
  .vC .daylabels .lbls { display: flex; }
  .vC .daylabels .lbls span { flex: 1; text-align: center; font-size: 10.5px; color: #5c6270; text-transform: uppercase; letter-spacing: .05em; }
  .vC .daylabels .cap { font-size: 10.5px; color: #5c6270; text-transform: uppercase; letter-spacing: .05em; }
  .vC .daylabels .cap.r { text-align: right; }

  /* Regel aus Mail — Seitenspalte C */
  .vC aside { border: 2px solid #14161a; border-radius: 10px; padding: 16px 18px; margin-top: 18px; position: sticky; top: 34px; }
  .vC aside h2 { margin: 0; font-size: 14px; }
  .vC aside .sub { font-size: 11.5px; color: #5c6270; margin: 3px 0 12px; }
  .vC .maillist { display: flex; flex-direction: column; gap: 6px; }
  .vC .mailrow { border: 1px solid #d9dce3; border-radius: 7px; padding: 8px 10px; cursor: pointer; font-size: 12px; }
  .vC .mailrow:hover { border-color: #4a4fbf; }
  .vC .mailrow.sel { border-color: #4a4fbf; background: #f4f4fb; }

function aWizard(step) {
  const stepNames = ['Kunde & Name', 'Monitor-Art', 'Erkennung (Regel)', 'Parameter'];
  let body = '';
  if (step === 1) body = `
    <div class="field"><label>Kunde</label><select>${KUNDEN.filter((k) => !k.archiviert).map((k) => `<option>${esc(k.name)}</option>`).join('')}</select>
      <div class="hint">Monitor gehört genau einem Kunden — die Kunden-Zuordnung der Mail passiert vorher über die Zuordnungs-Merkmale.</div></div>
    <div class="field"><label>Name des Monitors</label><input type="text" placeholder="z. B. Veeam Backup Tagesreport"></div>
    <div class="field"><label>Regel-Quelle</label>
      <div class="radio-row"><label><input type="radio" name="quelle" checked> manuell</label>
      <label><input type="radio" name="quelle"> aus Vorlage <select style="width:auto;display:inline-block;margin-left:6px;"><option>Veeam Backup & Replication</option><option>Synology DSM</option><option>Sophos Firewall</option><option>APC USV</option></select></label></div>
      <div class="hint">Vorlagen werden kuratiert mit Releases ausgeliefert <span class="badge-frage">Detail · Ticket #9</span></div></div>`;
  if (step === 2) body = `<div class="artgrid">${Object.entries(ARTEN).map(([id, a]) => `
      <div class="artopt ${aArt === id ? 'sel' : ''}" onclick="aArt='${id}';aWizard(2)"><div class="an">${a.n}</div><div class="ad">${a.d}</div></div>`).join('')}
    </div><div class="field"><div class="hint" style="margin-top:10px;">Offenes Set — weitere Arten kommen später hinzu, ohne die Zustandsmaschine zu ändern.</div></div>`;
  if (step === 3) body = REGEL_FELDER;
  if (step === 4) body = ART_PARAMS[aArt];
  $('#a-modal').innerHTML = `
    <div class="modal-scrim" onclick="aCloseModal()"></div>
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close" onclick="aCloseModal()">✕</button>
      <h3>Monitor anlegen</h3>
      <div class="stepname">Schritt ${step} von 4 — ${stepNames[step - 1]}${step >= 2 ? ` · Art: ${ARTEN[aArt].n}` : ''}</div>
      <div class="steps">${[1, 2, 3, 4].map((s) => `<span class="s ${s <= step ? 'on' : ''}"></span>`).join('')}</div>
      ${body}
      <footer>
        ${step > 1 ? `<button class="btn-ghost" onclick="aWizard(${step - 1})">← Zurück</button>` : '<span></span>'}
        ${step < 4 ? `<button class="btn-primary" onclick="aWizard(${step + 1})">Weiter →</button>`
                   : `<button class="btn-primary" onclick="aCloseModal();toast('Prototyp: Monitor „angelegt“ (nicht gespeichert)')">Monitor anlegen</button>`}
      </footer>
    </div>`;
  // Scrim-Klick soll schließen, Klick im Modal nicht:
  $('#a-modal .modal-scrim').appendChild($('#a-modal .modal'));
}

/* =============== Varianten-Router + Switcher =============== */
const VARIANTEN = { A: { name: 'Kundenboard — Karten & Drawer', render: renderA }, B: { name: 'Leitstand — dunkle NOC-Konsole', render: renderB }, C: { name: 'Zeitachse — erwartet vs. eingetroffen', render: renderC } };
const KEYS = Object.keys(VARIANTEN);
function aktVariante() {
  const v = new URLSearchParams(location.search).get('variant');
  return KEYS.includes(v) ? v : 'A';
}
function zeige(v) {
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null, '', url);
  VARIANTEN[v].render();
  document.getElementById('pb-key').textContent = 'Variante ' + v;
  document.getElementById('pb-name').textContent = VARIANTEN[v].name;
  window.scrollTo(0, 0);
}
function schritt(delta) {
  const i = (KEYS.indexOf(aktVariante()) + delta + KEYS.length) % KEYS.length;
  zeige(KEYS[i]);
}
document.getElementById('pb-prev').addEventListener('click', () => schritt(-1));
document.getElementById('pb-next').addEventListener('click', () => schritt(1));
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') schritt(-1);
  if (e.key === 'ArrowRight') schritt(1);
});
zeige(aktVariante());
</script>
